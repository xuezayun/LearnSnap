name: app
description: "LearnSnap Kids"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.5
  image_picker: ^1.1.2
  camera: ^0.11.1
  uuid: ^4.5.1
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  video_player: ^2.9.3
  path: ^1.9.1
  path_provider: ^2.1.5
  google_fonts: ^8.1.0
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#2EC4B6"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/honor/
