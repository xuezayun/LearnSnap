name: app
description: "拍习惯：家庭习惯打卡"
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.5
  image_picker: ^1.1.2
  camera: ^0.11.1
  uuid: ^4.5.1
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  video_player: ^2.9.3
  path: ^1.9.1
  path_provider: ^2.1.5
  cross_file: ^0.3.4
  shared_preferences: ^2.5.3
  google_fonts: ^8.1.0
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# 鸿蒙4.0/EMUI 机型 ExoPlayer 硬解兼容问题：强制锁定旧版
dependency_overrides:
  video_player_android: 2.7.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  image_path_ios: assets/icon/app_icon_ios.png
  image_path_ios_dark_transparent: assets/icon/app_icon_ios.png
  adaptive_icon_background: "#2EC4B6"
  adaptive_icon_foreground: assets/icon/app_icon.png
  # 与 iOS 预留边一致：Android 8+ 桌面图标默认 inset 16%
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: "#2EC4B6"

flutter:
  uses-material-design: true
  assets:
    - assets/honor/
