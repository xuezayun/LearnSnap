workflows:
  ios-simulator:
    name: iOS Simulator Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # 移除了 ios_signing 和 integrations，模拟器构建不需要签名和 App Store Connect
    scripts:
      - name: Build .app for Simulator
        script: |
          flutter build ios --simulator --debug --no-codesign
          if [ -d "build/ios/iphonesimulator" ]; then
            cd build/ios/iphonesimulator
            zip -r Runner.app.zip Runner.app
          else
            echo "Build directory not found, build failed!"
            exit 1
          fi
    artifacts:
      # 产物为压缩后的 .zip 文件，可直接上传至 Appetize.io
      - build/ios/iphonesimulator/Runner.app.zip